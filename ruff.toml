# Ruff configuration for the ledger scripts under notes/scripts/ (math-e8k).
#
# The gate command is `.venv/bin/ruff check notes/scripts/` and it must exit 0.
# Every rule below that is ignored carries the count it was measured at and the reason the finding is
# not a defect. The counts are re-derivable: `.venv/bin/ruff check --select <rule> notes/scripts/`
# prints them, so a count here is a dated measurement, not a carried figure.

target-version = "py312"

[lint]
select = [
    "E1",
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "I",
    "SIM",
    "PLW",
    "PERF",
    "PIE",
    "RUF",
    "UP",
    "ISC",
    "FURB",
    "C4",
    "RET",
]
ignore = [
    # 164 sites, measured 2026-10-12. The report strings are built with %-formatting on purpose: a
    # report line is a printf template reused across tiers. Ruff's fix is `.format()`, not an
    # f-string, and it is marked unsafe because it is not always neutral: on a regex built by
    # %-substitution it doubles `{` for the format layer, so `([{\"\"])` becomes `([{{\"\"])` and
    # the character class gains `{`. The 164 sites need per-site review, not autofix.
    "UP031",
    # 95 sites, measured 2026-10-12. `l` is a line and `I` never appears; the ambiguous-name rule
    # is about readers mistaking a letter for a digit, and in these scripts the single-letter names
    # are line, row and counter locals inside a loop that is ten lines long.
    "E741",
    # 30 sites, measured 2026-10-12. A report-building loop that appends under a condition is the
    # local shape; the comprehension rewrite hides the condition inside a generator expression.
    "PERF401",
    # 43 + 13 sites, measured 2026-10-12. The corpus's own bytes are the payload: U+2019 apostrophes,
    # `…` anchor suffixes and `→` arrows appear in the quotations and needles the checkers match
    # verbatim, so a "look-alike" character is the point of the string, not a typo.
    "RUF001",
    "RUF002",
    # 4 sites, measured 2026-10-12. The report accumulators are module-level by design.
    "PLW0603",
    # 1 site, measured 2026-10-12. The if/else block is the report's own branch.
    "SIM108",
    # 3 sites, measured 2026-10-12. Each is the `prev is not None` guard of a running-maxima loop.
    # Merging it into `prev is not None and n > prev[1]` makes pylint report E1136 (unsubscriptable)
    # at every `prev[i]`: pylint does not narrow a None-guard across `and`, and annotating
    # `prev: tuple[int, int, str] | None` does not change that (measured on a copy). The nested form
    # is what keeps both linters quiet, so the rule is ignored rather than the guard split.
    "SIM102",
]

[lint.per-file-ignores]
# Empty, and E402 stays enabled corpus-wide. The scripts used to import a sibling module through
# sys.path.insert and carried 13 `# noqa: E402` markers for it; a script run as
# `python3 notes/scripts/foo.py` already has notes/scripts as sys.path[0], so the inserts and the
# markers are both gone (measured 0 of each) and no file needs an import-position exemption.
