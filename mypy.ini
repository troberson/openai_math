# mypy configuration for the ledger scripts under notes/scripts/, including the extracted checker
# self-tests under notes/scripts/tests/ (math-e8k).
#
# Gate command: `.venv/bin/mypy notes/scripts/` — it must exit 0.
# Each setting below carries its own reason in the comment beside it. The strict probe,
# `.venv/bin/mypy --check-untyped-defs notes/scripts/`, is not a gate command: its findings are the
# annotation backlog, which is queue state, not a page.

[mypy]
python_version = 3.12
# The extracted checker self-tests live in notes/scripts/tests/ and import the checker modules and the
# catlib package by the same names the scripts use. Without an explicit base mypy takes the file's own
# directory (which has no __init__.py) as the module root, so catlib is not under it and the package
# import resolves to an empty module; the script tree has to be the base for the import to resolve.
mypy_path = notes/scripts
explicit_package_bases = True
# The scripts import each other through sys.path.insert, not as a package, so mypy must not try to
# follow a sibling import it cannot resolve as a module.
ignore_missing_imports = True
follow_imports = skip
# The scripts are untyped by design: a report line is the contract, not a signature. Checking the
# bodies of untyped functions would flag code mypy has no annotations to reason about.
check_untyped_defs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False
warn_unused_ignores = False
