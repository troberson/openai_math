# mypy configuration for the ledger scripts under notes/scripts/ (math-e8k).
#
# Gate command: `.venv/bin/mypy notes/scripts/` — it must exit 0.
# notes/linting.md records the per-file status and why each setting below is what it is.

[mypy]
python_version = 3.12
# The scripts import each other through sys.path.insert, not as a package, so mypy must not try to
# follow a sibling import it cannot resolve as a module.
ignore_missing_imports = True
follow_imports = skip
# The scripts are untyped by design: a report line is the contract, not a signature. Checking the
# bodies of untyped functions would flag code mypy has no annotations to reason about.
check_untyped_defs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False
warn_unused_ignores = False
